<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciar Usuários — SCTEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script>
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem("SCTEC_CONFIG") || "{}");
          var cores = cfg.cores || {};
          var r = document.documentElement;
          if (cores.header) r.style.setProperty("--sc-header", cores.header);
          if (cores.btn) r.style.setProperty("--sc-btn", cores.btn);
          if (cores.destaque) r.style.setProperty("--sc-header2", cores.destaque);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light">

    <div id="app-navbar"></div>

    <main class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 id="rotinaTitle">👑 Painel do Administrador</h1>
        <div>
          <span class="badge bg-secondary me-2" id="admin-org-nome"></span>
          <button class="btn btn-outline-primary btn-sm" id="btn-copiar-convite" title="Copiar código de convite">
            📋 Código de Convite
          </button>
        </div>
      </div>

      <!-- CARD CÓDIGO DE CONVITE -->
      <div class="alert alert-info d-flex align-items-center gap-3 mb-4" id="card-convite">
        <div>
          <strong>Código de Convite da Organização:</strong>
          <span id="codigo-convite-display" class="ms-2 fw-bold font-monospace fs-5"></span>
        </div>
        <button class="btn btn-sm btn-outline-primary ms-auto" id="btn-copiar-codigo">📋 Copiar</button>
      </div>

      <!-- TABELA DE USUÁRIOS -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="thead-sctec">
              <tr>
                <th>Usuário</th>
                <th>Perfil</th>
                <th>Papel de Trabalho</th>
                <th>Cadastrado em</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="admin-usuarios-lista"></tbody>
          </table>
        </div>
      </div>

      <!-- SEÇÃO DE PAPÉIS DE TRABALHO -->
      <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
        <h2 class="h5 mb-0">🏷️ Papéis de Trabalho</h2>
        <button class="btn btn-sm btn-primary" id="btn-novo-papel">➕ Novo Papel</button>
      </div>

      <!-- FORMULÁRIO CRIAR/EDITAR PAPEL (oculto por padrão) -->
      <div class="card shadow-sm border-0 mb-3 d-none" id="card-form-papel">
        <div class="card-body">
          <h6 id="form-papel-titulo" class="mb-3">Novo Papel</h6>
          <div class="d-flex gap-2 align-items-end">
            <div class="flex-grow-1">
              <label for="input-nome-papel" class="form-label small mb-1">Nome do Papel</label>
              <input type="text" id="input-nome-papel" class="form-control form-control-sm"
                placeholder="Ex: Vendedor, Analista, Gerente..." maxlength="40" />
            </div>
            <div>
              <input type="hidden" id="input-papel-id" value="" />
              <button class="btn btn-sm btn-success" id="btn-salvar-papel">💾 Salvar</button>
              <button class="btn btn-sm btn-outline-secondary ms-1" id="btn-cancelar-papel">Cancelar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TABELA DE PAPÉIS -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="thead-sctec">
              <tr>
                <th>Papel</th>
                <th>Código de Convite</th>
                <th class="text-center">Usuários</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="admin-papeis-lista"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/js/core/config.js"></script>
    <script src="./src/js/core/auth.js"></script>
    <script src="./src/js/core/roles.js"></script>
    <script src="./src/js/core/modules.js"></script>
    <script src="./src/js/core/theme.js"></script>
    <script src="./src/js/core/navbar.js"></script>
    <script src="./src/js/pages/admin.js"></script>
    <script src="./src/js/core/inactivity.js"></script>
  </body>
</html>
