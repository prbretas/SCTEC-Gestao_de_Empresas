<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Propostas — SCTEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script>
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem("SCTEC_CONFIG") || "{}");
          var cores = cfg.cores || {};
          var r = document.documentElement;
          if (cores.header) r.style.setProperty("--sc-header", cores.header);
          if (cores.btn) r.style.setProperty("--sc-btn", cores.btn);
          if (cores.destaque) r.style.setProperty("--sc-header2", cores.destaque);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light">
    <div id="app-navbar"></div>
    <main class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 id="rotinaTitle">📄 Propostas e Orçamentos</h1>
        <button class="btn btn-success" id="btn-nova-proposta">+ Nova Proposta</button>
      </div>

      <!-- FILTROS + TOGGLE VISUALIZAÇÃO -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3">
          <div class="row g-2 align-items-center">
            <div class="col-auto"><input type="date" id="prop-filtro-inicio" class="form-control form-control-sm" /></div>
            <div class="col-auto"><span class="text-muted">até</span></div>
            <div class="col-auto"><input type="date" id="prop-filtro-fim" class="form-control form-control-sm" /></div>
            <div class="col-auto">
              <select id="prop-filtro-status" class="form-select form-select-sm" style="width:auto;">
                <option value="">Todos os Status</option>
                <option value="rascunho">📝 Rascunho</option>
                <option value="enviada">📤 Enviada</option>
                <option value="aceita">✅ Aceita</option>
                <option value="recusada">❌ Recusada</option>
              </select>
            </div>
            <div class="col-auto"><button class="btn btn-sm btn-primary" id="btn-filtrar-prop">Filtrar</button></div>
            <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" id="btn-limpar-filtro-prop">Limpar</button></div>
            <div class="col-auto ms-auto">
              <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-secondary active" id="btn-view-cards" title="Cards">🃏</button>
                <button class="btn btn-outline-secondary" id="btn-view-linhas" title="Linhas">☰</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- MINI-DASHBOARD PROPOSTAS -->
      <div class="row g-3 mb-4" id="prop-mini-dashboard">
        <div class="col-md-3">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Total</div>
            <h5 class="mb-0 fw-bold" id="prop-kpi-total">0</h5>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">📤 Enviadas</div>
            <h5 class="mb-0 fw-bold text-primary" id="prop-kpi-enviadas">0</h5>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">✅ Aceitas</div>
            <h5 class="mb-0 fw-bold text-success" id="prop-kpi-aceitas">0</h5>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">💰 Valor Aceitas</div>
            <h5 class="mb-0 fw-bold text-success" id="prop-kpi-valor">R$ 0</h5>
          </div>
        </div>
      </div>

      <!-- LISTA -->
      <div id="propostas-lista" class="row g-3"></div>

      <div id="propostas-vazio" class="text-center py-5 d-none">
        <div style="font-size:3rem;">📄</div>
        <h5 class="mt-3 text-muted">Nenhuma proposta criada</h5>
      </div>
    </main>

    <!-- MODAL: Criar/Editar Proposta -->
    <div class="modal fade" id="modal-proposta" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header text-white">
            <h5 class="modal-title" id="titulo-modal-proposta">📄 Nova Proposta</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="form-proposta">
              <div class="row g-3 mb-3">
                <div class="col-md-8">
                  <label class="form-label fw-bold">Título *</label>
                  <input type="text" id="prop-titulo" class="form-control" required placeholder="Ex: Proposta de Desenvolvimento Web" />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Número</label>
                  <input type="text" id="prop-numero" class="form-control" placeholder="Ex: 2026-001" />
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Empresa *</label>
                  <select id="prop-empresa" class="form-select" required>
                    <option value="">Selecione...</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-bold">Validade</label>
                  <input type="date" id="prop-validade" class="form-control" />
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-bold">Status</label>
                  <select id="prop-status" class="form-select">
                    <option value="rascunho">📝 Rascunho</option>
                    <option value="enviada">📤 Enviada</option>
                    <option value="aceita">✅ Aceita</option>
                    <option value="recusada">❌ Recusada</option>
                  </select>
                </div>
              </div>

              <!-- ITENS DA PROPOSTA -->
              <h6 class="fw-bold mt-2 mb-2">📦 Itens</h6>
              <div id="prop-itens-lista"></div>
              <button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="btn-add-item">+ Adicionar Item</button>

              <div class="row g-3 mt-3">
                <div class="col-md-4 ms-auto">
                  <div class="d-flex justify-content-between fw-bold border-top pt-2">
                    <span>Total:</span>
                    <span id="prop-total-display" class="text-success">R$ 0,00</span>
                  </div>
                </div>
              </div>

              <div class="mb-3 mt-3">
                <label class="form-label fw-bold">Observações / Condições</label>
                <textarea id="prop-obs" class="form-control" rows="3" placeholder="Condições de pagamento, prazo de entrega, etc."></textarea>
              </div>

              <!-- Anexos -->
              <div class="mb-3">
                <div id="prop-anexos-container"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer d-flex justify-content-between">
            <button type="button" class="btn btn-outline-secondary" id="btn-imprimir-proposta">🖨️ Imprimir / PDF</button>
            <div id="auditoria-prop" class="small text-muted mx-auto align-self-center"></div>
            <div>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="button" class="btn btn-primary d-none" id="btn-editar-proposta">✏️ Editar</button>
              <button type="submit" form="form-proposta" class="btn btn-success">Salvar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/js/core/config.js"></script>
    <script src="./src/js/core/auth.js"></script>
    <script src="./src/js/core/storage.js"></script>
    <script src="./src/js/core/roles.js"></script>
    <script src="./src/js/core/modules.js"></script>
    <script src="./src/js/core/approvals.js"></script>
    <script src="./src/js/core/integrations.js"></script>
    <script src="./src/js/core/theme.js"></script>
    <script src="./src/js/core/navbar.js"></script>
    <script src="./src/js/shared/attachments.js"></script>
    <script src="./src/js/modules/propostas.js"></script>
    <script src="./src/js/core/inactivity.js"></script>
  </body>
</html>
