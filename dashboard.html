<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png"
    href="https://images.emojiterra.com/google/noto-emoji/unicode-16.0/color/svg/1f3ed.svg" />
  <title>Dashboard — SCTEC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/styles.css" />
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('SCTEC_CONFIG') || '{}');
        var cores = cfg.cores || {};
        var r = document.documentElement;
        if (cores.header) r.style.setProperty('--sc-header', cores.header);
        if (cores.btn) r.style.setProperty('--sc-btn', cores.btn);
        if (cores.destaque) r.style.setProperty('--sc-header2', cores.destaque);
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-light">
  <div id="app-navbar"></div>

  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="rotinaTitle">📊 Dashboard</h1>
      <div class="d-flex gap-2 align-items-center">
        <!-- Seletor de Modelo -->
        <select class="form-select form-select-sm" id="select-modelo-dash" style="width:auto;min-width:160px;">
          <option value="__default__">Modelo Padrão</option>
        </select>
        <button class="btn btn-outline-success btn-sm" id="btn-salvar-modelo" title="Salvar como novo modelo">💾 Salvar Modelo</button>
        <button class="btn btn-outline-danger btn-sm d-none" id="btn-excluir-modelo" title="Excluir modelo selecionado">🗑️</button>
        <button class="btn btn-outline-primary btn-sm" id="btn-configurar-dash">⚙️ Configurar</button>
        <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">🖨️</button>
      </div>
    </div>

    <!-- FILTRO DE PERÍODO -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-auto">
            <label class="form-label small mb-0 fw-bold">📅 Período:</label>
          </div>
          <div class="col-auto">
            <input type="date" id="dash-data-inicio" class="form-control form-control-sm" />
          </div>
          <div class="col-auto">
            <span class="text-muted">até</span>
          </div>
          <div class="col-auto">
            <input type="date" id="dash-data-fim" class="form-control form-control-sm" />
          </div>
          <div class="col-auto">
            <button class="btn btn-sm btn-primary" id="btn-aplicar-filtro-dash">Aplicar</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-sm btn-outline-secondary" id="btn-limpar-filtro-dash">Limpar</button>
          </div>
          <div class="col-auto ms-auto">
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-secondary dash-preset-periodo" data-dias="7">7d</button>
              <button class="btn btn-outline-secondary dash-preset-periodo" data-dias="30">30d</button>
              <button class="btn btn-outline-secondary dash-preset-periodo" data-dias="90">90d</button>
              <button class="btn btn-outline-secondary dash-preset-periodo" data-dias="365">1 ano</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- GRID DINÂMICO DE WIDGETS — renderizado por JS -->
    <div id="dashboard-grid" class="row g-3"></div>
  </main>

  <!-- MODAL CONFIGURAR WIDGETS -->
  <div class="modal fade" id="modal-config-dash" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title">⚙️ Configurar Dashboard</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">Selecione quais widgets deseja ver. A configuração é salva por modelo.</p>
          <div id="config-widgets-lista"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" id="btn-salvar-config-dash">💾 Salvar e Aplicar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./src/js/core/config.js"></script>
  <script src="./src/js/core/auth.js"></script>
  <script src="./src/js/core/storage.js"></script>
  <script src="./src/js/core/roles.js"></script>
  <script src="./src/js/core/modules.js"></script>
  <script src="./src/js/core/theme.js"></script>
  <script src="./src/js/core/params.js"></script>`n    <script src="./src/js/core/navbar.js"></script>
  <script src="./src/js/shared/tarefas.js"></script>
  <script src="./src/js/core/dashboard-storages.js"></script>
  <script src="./src/js/core/dashboard-config.js"></script>
  <script src="./src/js/pages/dashboard.js"></script>
  <script src="./src/js/core/inactivity.js"></script>
</body>

</html>
