<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financeiro — SCTEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script>
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem("SCTEC_CONFIG") || "{}");
          var cores = cfg.cores || {};
          var r = document.documentElement;
          if (cores.header) r.style.setProperty("--sc-header", cores.header);
          if (cores.btn) r.style.setProperty("--sc-btn", cores.btn);
          if (cores.destaque) r.style.setProperty("--sc-header2", cores.destaque);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light">
    <div id="app-navbar"></div>
    <main class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 id="rotinaTitle">💰 Controle Financeiro</h1>
        <button class="btn btn-success" id="btn-nova-transacao">+ Novo Lançamento</button>
      </div>

      <!-- CARDS DE RESUMO -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card-resumo card border-0 shadow-sm bg-success">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="small text-white-50">Total Entradas</div>
                <h4 class="mb-0 fw-bold text-white" id="resumo-entradas">R$ 0,00</h4>
              </div>
              <span style="font-size:2rem;">⬆️</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-resumo card border-0 shadow-sm bg-danger">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="small text-white-50">Total Saídas</div>
                <h4 class="mb-0 fw-bold text-white" id="resumo-saidas">R$ 0,00</h4>
              </div>
              <span style="font-size:2rem;">⬇️</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-resumo card border-0 shadow-sm" id="card-saldo">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="small" id="resumo-saldo-label">Saldo</div>
                <h4 class="mb-0 fw-bold" id="resumo-saldo">R$ 0,00</h4>
              </div>
              <span style="font-size:2rem;">💼</span>
            </div>
          </div>
        </div>
      </div>

      <!-- FILTROS -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3">
          <div class="row g-2">
            <div class="col-md-3">
              <input type="month" id="filtro-mes" class="form-control" />
            </div>
            <div class="col-md-3">
              <select id="filtro-tipo" class="form-select">
                <option value="">Entrada e Saída</option>
                <option value="entrada">Entradas</option>
                <option value="saida">Saídas</option>
              </select>
            </div>
            <div class="col-md-4">
              <input type="text" id="filtro-busca" class="form-control" placeholder="Buscar por descrição..." />
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100" id="btn-limpar">🔄</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TABELA -->
      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="thead-sctec">
              <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Empresa</th>
                <th class="text-end">Valor</th>
                <th class="text-center">Vencimento</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="financeiro-lista"></tbody>
          </table>
        </div>
      </div>

      <div id="financeiro-vazio" class="text-center py-5 d-none">
        <div style="font-size:3rem;">💰</div>
        <h5 class="mt-3 text-muted">Nenhuma transação encontrada</h5>
      </div>
    </main>

    <!-- MODAL -->
    <div class="modal fade" id="modal-transacao" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header text-white">
            <h5 class="modal-title" id="titulo-modal-transacao">💰 Novo Lançamento</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="form-transacao">
              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label class="form-label fw-bold">Nº Registro</label>
                  <input type="text" id="trans-numero" class="form-control" placeholder="Auto" readonly />
                </div>
                <div class="col-md-8">
                  <label class="form-label fw-bold">Tipo Fiscal *</label>
                  <select id="trans-tipo-fiscal" class="form-select">
                    <option value="">— Selecione o tipo —</option>
                    <option value="nfs">NFs — Nota Fiscal de Saída (Venda = Entrada $)</option>
                    <option value="nfe">NFe — Nota Fiscal de Entrada (Compra = Saída $)</option>
                  </select>
                  <input type="hidden" name="trans-tipo" id="trans-tipo-hidden" value="entrada" />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Descrição *</label>
                <input type="text" id="trans-descricao" class="form-control" required />
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Valor (R$) *</label>
                  <input type="number" id="trans-valor" class="form-control" min="0.01" step="0.01" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Data *</label>
                  <input type="date" id="trans-data" class="form-control" required />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Categoria</label>
                <select id="trans-categoria" class="form-select">
                  <option value="servicos">Serviços</option>
                  <option value="produtos">Produtos</option>
                  <option value="salarios">Salários</option>
                  <option value="impostos">Impostos</option>
                  <option value="aluguel">Aluguel</option>
                  <option value="marketing">Marketing</option>
                  <option value="outros">Outros</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Empresa</label>
                <select id="trans-empresa" class="form-select">
                  <option value="">— Nenhuma —</option>
                </select>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Data de Vencimento</label>
                  <input type="date" id="trans-vencimento" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Status Pagamento</label>
                  <select id="trans-status-pagamento" class="form-select">
                    <option value="pendente">⏳ Pendente</option>
                    <option value="pago">✅ Pago</option>
                    <option value="vencido">⚠️ Vencido</option>
                  </select>
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label class="form-label fw-bold">Forma de Pagamento</label>
                  <select id="trans-forma-pagamento" class="form-select">
                    <option value="">— Selecione —</option>
                    <option value="boleto">📋 Boleto</option>
                    <option value="pix">⚡ PIX</option>
                    <option value="cartao_credito">💳 Cartão Crédito</option>
                    <option value="cartao_debito">💳 Cartão Débito</option>
                    <option value="transferencia">🏦 Transferência</option>
                    <option value="dinheiro">💵 Dinheiro</option>
                    <option value="cheque">📄 Cheque</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Parcelas</label>
                  <select id="trans-parcelas" class="form-select">
                    <option value="1">1x (à vista)</option>
                  </select>
                  <div class="form-text small" id="trans-valor-parcela"></div>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Valor da Parcela</label>
                  <input type="text" id="trans-valor-parcela-display" class="form-control" readonly disabled />
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Proposta Vinculada</label>
                  <select id="trans-proposta-vinculada" class="form-select">
                    <option value="">— Nenhuma —</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Oportunidade Vinculada</label>
                  <select id="trans-oportunidade-vinculada" class="form-select">
                    <option value="">— Nenhuma —</option>
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Observações</label>
                <textarea id="trans-obs" class="form-control" rows="2"></textarea>
              </div>

              <!-- Itens detalhados (NFe) — visível quando há itens -->
              <div class="mb-3 d-none" id="trans-itens-section">
                <label class="form-label fw-bold">📦 Itens da Proposta</label>
                <div id="trans-itens-lista" class="small border rounded p-2 bg-light"></div>
              </div>

              <!-- Anexos -->
              <div class="mb-3">
                <div id="trans-anexos-container"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <div id="auditoria-fin" class="small text-muted me-auto"></div>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="button" class="btn btn-primary d-none" id="btn-editar-transacao">✏️ Editar</button>
            <button type="submit" form="form-transacao" class="btn btn-success" id="btn-salvar-transacao">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/js/core/config.js"></script>
    <script src="./src/js/core/auth.js"></script>
    <script src="./src/js/shared/utils.js"></script>
    <script src="./src/js/core/storage.js"></script>
    <script src="./src/js/core/roles.js"></script>
    <script src="./src/js/core/modules.js"></script>
    <script src="./src/js/core/theme.js"></script>
    <script src="./src/js/core/params.js"></script>    <script src="./src/js/core/navbar.js"></script>
    <script src="./src/js/core/dashboard-storages.js"></script>
    <script src="./src/js/shared/attachments.js"></script>
    <script src="./src/js/modules/financeiro.js"></script>
    <script src="./src/js/shared/calculator.js"></script>    <script src="./src/js/core/inactivity.js"></script>
  </body>
</html>
