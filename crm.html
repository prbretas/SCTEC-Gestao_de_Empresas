<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM — SCTEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <style>
      .kanban-col { min-height: 400px; background: #f8f9fa; border-radius: 12px; padding: 12px; }
      .kanban-card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 4px solid #dee2e6; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.06); transition: box-shadow .15s; }
      .kanban-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
      .kanban-col-title { font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
      body.dark-mode .kanban-col { background: #1e1e1e; }
      body.dark-mode .kanban-card { background: #2c2c2c; color: #e0e0e0; border-left-color: #444; }
    </style>
    <script>
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem("SCTEC_CONFIG") || "{}");
          var cores = cfg.cores || {};
          var r = document.documentElement;
          if (cores.header) r.style.setProperty("--sc-header", cores.header);
          if (cores.btn) r.style.setProperty("--sc-btn", cores.btn);
          if (cores.destaque) r.style.setProperty("--sc-header2", cores.destaque);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light">

    <div id="app-navbar"></div>

    <main class="container-fluid pb-5 px-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 id="rotinaTitle">🎯 Funil de Vendas — CRM</h1>
        <button class="btn btn-success" id="btn-nova-oportunidade">+ Novo Negócio</button>
      </div>

      <!-- FILTRO DE PERÍODO + ARQUIVAR -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3">
          <div class="row g-2 align-items-center">
            <div class="col-auto"><label class="small fw-bold mb-0">📅 Período:</label></div>
            <div class="col-auto"><input type="date" id="crm-filtro-inicio" class="form-control form-control-sm" /></div>
            <div class="col-auto"><span class="text-muted">até</span></div>
            <div class="col-auto"><input type="date" id="crm-filtro-fim" class="form-control form-control-sm" /></div>
            <div class="col-auto"><button class="btn btn-sm btn-primary" id="btn-filtrar-crm">Filtrar</button></div>
            <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" id="btn-limpar-filtro-crm">Limpar</button></div>
            <div class="col-auto ms-auto">
              <button class="btn btn-sm btn-outline-warning" id="btn-arquivar-crm">📦 Arquivar Finalizadas</button>
            </div>
          </div>
        </div>
      </div>

      <!-- MINI-DASHBOARD CRM -->
      <div class="row g-3 mb-4" id="crm-mini-dashboard">
        <div class="col-md-2">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Pipeline Total</div>
            <h5 class="mb-0 fw-bold text-success" id="crm-kpi-pipeline">R$ 0</h5>
          </div>
        </div>
        <div class="col-md-2">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Prospecção</div>
            <h5 class="mb-0 fw-bold" id="crm-kpi-prospeccao">0</h5>
          </div>
        </div>
        <div class="col-md-2">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Contato</div>
            <h5 class="mb-0 fw-bold text-primary" id="crm-kpi-contato">0</h5>
          </div>
        </div>
        <div class="col-md-2">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Proposta</div>
            <h5 class="mb-0 fw-bold text-info" id="crm-kpi-proposta">0</h5>
          </div>
        </div>
        <div class="col-md-2">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Negociação</div>
            <h5 class="mb-0 fw-bold text-warning" id="crm-kpi-negociacao">0</h5>
          </div>
        </div>
        <div class="col-md-2">
          <div class="card border-0 shadow-sm text-center py-2">
            <div class="small text-muted">Fechado</div>
            <h5 class="mb-0 fw-bold text-success" id="crm-kpi-fechado">0</h5>
          </div>
        </div>
      </div>

      <!-- KANBAN BOARD -->
      <div class="row g-3">
        <div class="col-md-2">
          <div class="kanban-col">
            <div class="kanban-col-title text-muted">📥 Prospecção</div>
            <div id="col-prospeccao"></div>
          </div>
        </div>
        <div class="col-md-2">
          <div class="kanban-col">
            <div class="kanban-col-title" style="color:#0d6efd;">📬 Contato Feito</div>
            <div id="col-contato"></div>
          </div>
        </div>
        <div class="col-md-2">
          <div class="kanban-col">
            <div class="kanban-col-title" style="color:#6f42c1;">🤝 Proposta</div>
            <div id="col-proposta"></div>
          </div>
        </div>
        <div class="col-md-2">
          <div class="kanban-col">
            <div class="kanban-col-title" style="color:#fd7e14;">🔄 Negociação</div>
            <div id="col-negociacao"></div>
          </div>
        </div>
        <div class="col-md-2">
          <div class="kanban-col">
            <div class="kanban-col-title" style="color:#198754;">✅ Fechado</div>
            <div id="col-fechado"></div>
          </div>
        </div>
        <div class="col-md-2">
          <div class="kanban-col">
            <div class="kanban-col-title" style="color:#dc3545;">❌ Perdido</div>
            <div id="col-perdido"></div>
          </div>
        </div>
      </div>
      <!-- SEÇÃO ARQUIVADOS -->
      <div class="mt-5 d-none" id="crm-arquivados-section">
        <h5 class="text-muted mb-3">📦 Negócios Arquivados</h5>
        <div class="table-responsive">
          <table class="table table-sm table-hover">
            <thead class="table-light">
              <tr><th>Título</th><th>Empresa</th><th>Etapa</th><th>Valor</th><th>Ações</th></tr>
            </thead>
            <tbody id="crm-arquivados-lista"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- MODAL: Nova/Editar Oportunidade -->
    <div class="modal fade" id="modal-oportunidade" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header text-white">
            <h5 class="modal-title" id="titulo-modal-oportunidade">🎯 Novo Negócio</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="form-oportunidade">
              <div class="mb-3">
                <label class="form-label fw-bold">Título *</label>
                <input type="text" id="op-titulo" class="form-control" required placeholder="Ex: Proposta de contrato anual" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Empresa *</label>
                <select id="op-empresa" class="form-select" required>
                  <option value="">Selecione...</option>
                </select>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Valor (R$)</label>
                  <input type="number" id="op-valor" class="form-control" placeholder="0,00" min="0" step="0.01" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Previsão de Fechamento</label>
                  <input type="date" id="op-previsao" class="form-control" />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Etapa</label>
                <select id="op-etapa" class="form-select">
                  <option value="prospeccao">📥 Prospecção</option>
                  <option value="contato">📬 Contato Feito</option>
                  <option value="proposta">🤝 Proposta</option>
                  <option value="negociacao">🔄 Negociação</option>
                  <option value="fechado">✅ Fechado</option>
                  <option value="perdido">❌ Perdido</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Responsável</label>
                <input type="text" id="op-responsavel" class="form-control" placeholder="Nome do responsável" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Proposta Vinculada</label>
                <select id="op-proposta" class="form-select">
                  <option value="">— Nenhuma —</option>
                </select>
                <div class="form-text small text-muted">Obrigatório para etapas Negociação e Fechado.</div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Observações</label>
                <textarea id="op-observacoes" class="form-control" rows="3"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <div id="auditoria-crm" class="small text-muted me-auto"></div>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="button" class="btn btn-primary d-none" id="btn-editar-oportunidade">✏️ Editar</button>
            <button type="submit" form="form-oportunidade" class="btn btn-success" id="btn-salvar-oportunidade">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/js/core/config.js"></script>
    <script src="./src/js/core/auth.js"></script>
    <script src="./src/js/core/storage.js"></script>
    <script src="./src/js/core/roles.js"></script>
    <script src="./src/js/core/modules.js"></script>
    <script src="./src/js/core/approvals.js"></script>
    <script src="./src/js/core/integrations.js"></script>
    <script src="./src/js/core/theme.js"></script>
    <script src="./src/js/core/navbar.js"></script>
    <script src="./src/js/core/dashboard-storages.js"></script>
    <script src="./src/js/modules/crm.js"></script>
    <script src="./src/js/core/inactivity.js"></script>
  </body>
</html>
