<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios — SCTEC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/styles.css" />
  <style>
    @media print {
      #app-navbar, .no-print, .btn { display: none !important; }
      body { background: #fff !important; }
      .card { box-shadow: none !important; border: 1px solid #dee2e6 !important; }
    }
  </style>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('SCTEC_CONFIG') || '{}');
        var cores = cfg.cores || {};
        var r = document.documentElement;
        if (cores.header) r.style.setProperty('--sc-header', cores.header);
        if (cores.btn) r.style.setProperty('--sc-btn', cores.btn);
        if (cores.destaque) r.style.setProperty('--sc-header2', cores.destaque);
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="rotinaTitle">📑 Relatórios Avançados</h1>
      <div class="d-flex gap-2 no-print">
        <button class="btn btn-outline-success btn-sm" id="btn-exportar-csv-relatorio">📥 Exportar CSV</button>
        <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">🖨️ Imprimir / PDF</button>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="card shadow-sm border-0 mb-4 no-print">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-auto"><label class="form-label small mb-0 fw-bold">📅 Período:</label></div>
          <div class="col-auto"><input type="date" id="rel-data-inicio" class="form-control form-control-sm" /></div>
          <div class="col-auto"><span class="text-muted">até</span></div>
          <div class="col-auto"><input type="date" id="rel-data-fim" class="form-control form-control-sm" /></div>
          <div class="col-auto"><button class="btn btn-sm btn-primary" id="btn-gerar-relatorio">📊 Gerar Relatório</button></div>
          <div class="col-auto ms-auto">
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-secondary rel-preset" data-dias="7">7d</button>
              <button class="btn btn-outline-secondary rel-preset" data-dias="30">30d</button>
              <button class="btn btn-outline-secondary rel-preset" data-dias="90">90d</button>
              <button class="btn btn-outline-secondary rel-preset" data-dias="365">1 ano</button>
            </div>
          </div>
        </div>
        <div class="mt-2 d-flex flex-wrap gap-3">
          <span class="small fw-bold">Incluir:</span>
          <div class="form-check form-check-inline"><input class="form-check-input rel-modulo-check" type="checkbox" id="rel-inc-fin" value="financeiro" checked /><label class="form-check-label small" for="rel-inc-fin">💰 Financeiro</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input rel-modulo-check" type="checkbox" id="rel-inc-crm" value="crm" checked /><label class="form-check-label small" for="rel-inc-crm">🎯 CRM</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input rel-modulo-check" type="checkbox" id="rel-inc-prop" value="propostas" checked /><label class="form-check-label small" for="rel-inc-prop">📄 Propostas</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input rel-modulo-check" type="checkbox" id="rel-inc-agenda" value="agenda" checked /><label class="form-check-label small" for="rel-inc-agenda">📅 Agenda</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input rel-modulo-check" type="checkbox" id="rel-inc-cad" value="cadastros" checked /><label class="form-check-label small" for="rel-inc-cad">📋 Cadastros</label></div>
        </div>
      </div>
    </div>

    <!-- CONTEÚDO DO RELATÓRIO -->
    <div id="relatorio-conteudo"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./src/js/core/config.js"></script>
  <script src="./src/js/core/auth.js"></script>
  <script src="./src/js/core/storage.js"></script>
  <script src="./src/js/core/roles.js"></script>
  <script src="./src/js/core/modules.js"></script>
  <script src="./src/js/core/dashboard-storages.js"></script>
  <script src="./src/js/shared/tarefas.js"></script>
  <script src="./src/js/core/theme.js"></script>
  <script src="./src/js/core/navbar.js"></script>
  <script src="./src/js/pages/relatorios.js"></script>
  <script src="./src/js/core/inactivity.js"></script>
</body>
</html>
